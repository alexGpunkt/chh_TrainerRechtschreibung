<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Rechtschreibtrainer RLP · Campus Hannah Höch</title>
<style>
:root {
  --text:#102033; --muted:#64748b; --accent:#2563eb; --accent2:#0f766e;
  --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --border:#cbd5e1;
  --bg:#f8fafc; --card:#ffffff; --shadow:0 18px 55px rgba(15,23,42,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:'Segoe UI',Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#dbeafe,#fff);overflow:hidden}
body.login-mode{display:flex;align-items:center;justify-content:center;padding:22px}
button{border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:17px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.20)}
button:disabled{opacity:.45;cursor:not-allowed} input,select,textarea{font-family:inherit}
input,select,textarea{font-size:18px;padding:12px 14px;border:2px solid var(--border);border-radius:15px;outline:none;background:#f8fafc;min-width:0}
textarea{width:100%;min-height:110px;resize:none} input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
.login{width:min(700px,94vw);background:#fff;border:1px solid #dbe3ef;border-radius:28px;padding:26px;box-shadow:var(--shadow);text-align:center}
.login img{width:128px;border-radius:18px;margin-bottom:12px;filter:drop-shadow(0 6px 18px rgba(15,23,42,.16))}
.login h1{margin:0;font-size:clamp(26px,5vw,40px)} .login p{color:var(--muted);line-height:1.45}
.login-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
.level-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;text-align:left}
.level-row label{font-size:13px;font-weight:900;color:#334155;display:flex;flex-direction:column;gap:5px}
.load-status{font-size:13px;color:var(--muted);margin-top:12px;text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}
.json-btn{background:#e2e8f0;color:#0f172a;box-shadow:none;font-size:14px;padding:9px 12px;margin-top:8px}
.app{display:none;width:100vw;height:100dvh;overflow:hidden;background:#fff} body.running .app{display:flex}
.stage{width:100%;height:100%;display:grid;grid-template-rows:auto 94px auto 1fr auto;background:#fff;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid #e2e8f0;background:#fff}
.brand{display:flex;align-items:center;gap:12px;min-width:0} .brand img{width:50px;height:50px;object-fit:contain;border-radius:12px}
.title{font-weight:950;font-size:clamp(17px,3vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sub{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.top-right{display:flex;align-items:center;gap:8px} .pill{font-size:13px;color:#334155;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:7px 10px;white-space:nowrap}
.menu-btn{width:46px;height:42px;padding:0;border-radius:14px;background:#111827;font-size:24px;display:flex;align-items:center;justify-content:center}
.journey{position:relative;background:#f8fafc;border-bottom:1px solid #e2e8f0;overflow:hidden}
.track-line{position:absolute;left:7%;right:5%;top:43px;height:8px;border-radius:99px;background:#cbd5e1} .track-fill{position:absolute;left:7%;top:43px;height:8px;border-radius:99px;background:linear-gradient(90deg,#22c55e,#2563eb);width:0;transition:.35s}
.milestone{position:absolute;top:22px;transform:translateX(-50%);width:112px;text-align:center;font-size:10px;font-weight:900;color:#334155} .milestone .dot{display:block;width:20px;height:20px;border:4px solid #94a3b8;border-radius:50%;background:#fff;margin:5px auto 2px} .milestone.done .dot{border-color:#16a34a;background:#dcfce7} .milestone.current .dot{border-color:#2563eb;background:#dbeafe}
.stick{position:absolute;top:9px;left:7%;width:34px;height:54px;transform:translateX(-50%);transition:.35s;filter:drop-shadow(0 4px 5px rgba(15,23,42,.18))} .stick svg{width:100%;height:100%} .stick line,.stick circle{stroke:#111827;stroke-width:4;stroke-linecap:round;fill:#fff} .stick .head{fill:#fef3c7}
.taskline{padding:10px 16px 8px;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:start} .prompt{font-size:clamp(20px,3.4vw,34px);font-weight:950;line-height:1.12} .type-badge{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:999px;padding:7px 11px;font-weight:900;white-space:nowrap}
.rule-inline{grid-column:1 / -1;background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.35;display:none} .rule-inline.open{display:block} .rule-toggle{background:#e2e8f0;color:#0f172a;box-shadow:none;font-size:14px;padding:8px 12px;white-space:nowrap}
.work{margin:0 14px 8px;border:2px dashed #dbeafe;background:#f8fafc;border-radius:24px;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0} .inner{width:min(1060px,100%);text-align:center}
.sentence{font-size:clamp(23px,3.8vw,44px);font-weight:800;line-height:1.35} .blank{display:inline-flex;min-width:120px;border-bottom:5px solid #2563eb;justify-content:center;color:#2563eb}
.options{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px} .option,.word-btn{background:#fff;color:#0f172a;border:2px solid #cbd5e1;box-shadow:none;min-width:112px} .option.selected,.word-btn.selected{background:#dbeafe;border-color:#2563eb} .option.correct,.word-btn.correct{background:#dcfce7;border-color:#16a34a;color:#14532d} .option.wrong,.word-btn.wrong{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}
.word-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px} .sort-area{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px} .box{min-height:120px;background:#fff;border:2px solid #cbd5e1;border-radius:18px;padding:10px} .box h3{margin:0 0 8px;font-size:16px;color:#334155} .chip{display:inline-flex;margin:5px;padding:9px 12px;border-radius:999px;background:#e2e8f0;color:#0f172a;font-weight:800;cursor:pointer} .chip.selected{background:#dbeafe;outline:3px solid #2563eb} .chip.placed{background:#e0f2fe} .chip.correct{background:#dcfce7} .chip.wrong{background:#fee2e2}
.text-answer{display:grid;gap:12px;margin-top:18px;text-align:left} .sample{background:#eef2ff;border:1px solid #c7d2fe;color:#312e81;border-radius:12px;padding:10px;font-size:14px}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid #e2e8f0;background:#fff} .feedback{font-weight:800;color:var(--muted);line-height:1.25} .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)} .feedback.warn{color:var(--warn)} .check{display:none;background:#0f766e} .check.show,.next.show{display:inline-flex} .next{display:none;background:#111827}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50} .drawer-backdrop.open{display:block} .drawer{position:fixed;left:0;top:0;bottom:0;width:min(500px,92vw);background:#fff;z-index:51;transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column;box-shadow:24px 0 60px rgba(15,23,42,.25)} .drawer.open{transform:translateX(0)} .drawer-head{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #e2e8f0;background:#f8fafc} .drawer-head img{width:42px;border-radius:10px} .drawer-head h2{flex:1;margin:0} .drawer-close{background:#e2e8f0;color:#111827;box-shadow:none;padding:8px 12px} .drawer-tabs{display:flex;gap:6px;padding:10px;background:#f8fafc;border-bottom:1px solid #e2e8f0;overflow:auto} .drawer-tab{flex:1;font-size:13px;background:#e2e8f0;color:#111827;box-shadow:none;padding:9px;white-space:nowrap} .drawer-tab.active{background:#2563eb;color:#fff} .panel{display:none;overflow:auto;padding:14px;flex:1} .panel.active{display:block} .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px} .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:10px} .stat b{font-size:22px;display:block} table{width:100%;border-collapse:collapse;font-size:13px} th,td{border:1px solid #e2e8f0;padding:7px;text-align:center} th{background:#eff6ff} td:first-child,th:first-child{text-align:left;font-weight:800} .help-card,.error-card{border:1px solid #e2e8f0;background:#f8fafc;border-radius:16px;padding:12px;margin:10px 0} .badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900}
@media(max-height:640px){.stage{grid-template-rows:auto 76px auto 1fr auto}.brand img{width:38px;height:38px}.track-line,.track-fill{top:34px}.milestone{top:14px;font-size:9px}.stick{top:5px;width:28px;height:45px}.prompt{font-size:clamp(18px,3vw,29px)}.sentence{font-size:clamp(20px,3vw,34px)}button{font-size:15px;padding:10px 13px}.rule-inline{font-size:13px;padding:7px 9px}}
@media(max-width:560px){.login-row,.level-row{grid-template-columns:1fr}.title{font-size:16px}.sub{display:none}.pill{display:none}.bottom{flex-wrap:wrap}.taskline{grid-template-columns:1fr}.rule-toggle{justify-self:start}}
</style>
</head>

  if(!j || !Array.isArray(j.stages)) throw new Error('Ungültige Aufgabenstruktur: Feld "stages" fehlt.');

  const data = structuredClone ? structuredClone(j) : JSON.parse(JSON.stringify(j));

  // Unterstützt beide JSON-Varianten:
  // 1. stages:[{..., tasks:[...]}]
  // 2. stages:[...], tasks:[{stage:'...', ...}]  ← bereinigte Aufgabenliste v3
  if(Array.isArray(data.tasks)){
    const byStage = {};
    data.tasks.forEach((t, idx)=>{
      const key = t.stage || t.stageKey || t.category || t.skill;
      if(!key) return;
      const clean = {...t};
      clean.id = clean.id || `${key}_${clean.type||'task'}_${idx+1}`;
      clean.type = clean.type || 'choice';
      clean.difficulty = clean.difficulty || clean.level || clean.niveau || 'A';
      byStage[key] = byStage[key] || [];
      byStage[key].push(clean);
    });
    data.stages.forEach(s=>{
      const existing = Array.isArray(s.tasks) ? s.tasks : [];
      const external = byStage[s.key] || [];
      s.tasks = existing.length ? existing : external;
    });
  } else {
    data.tasks = [];
    data.stages.forEach(s=>{
      s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
      s.tasks.forEach((t, idx)=>{
        t.stage = t.stage || s.key;
        t.id = t.id || `${s.key}_${t.type||'task'}_${idx+1}`;
        t.type = t.type || 'choice';
        t.difficulty = t.difficulty || t.level || t.niveau || 'A';
        data.tasks.push(t);
      });
    });
  }

  const stageKeys = new Set(data.stages.map(s=>s.key));
  const unknownTasks = (data.tasks || []).filter(t=>t.stage && !stageKeys.has(t.stage));
  const emptyStages = data.stages.filter(s=>!Array.isArray(s.tasks) || s.tasks.length===0).map(s=>s.label || s.key);
  if(emptyStages.length){
    console.warn('[Aufgaben] Keine Aufgaben für Stufen:', emptyStages.join(', '));
  }
  if(unknownTasks.length){
    console.warn('[Aufgaben] Aufgaben mit unbekannter Stufe:', unknownTasks.slice(0,10));
  }
  return data;
}
function setData(j,msg){
  DATA=normalizeData(j);
  initStateStructures();
  const count=(DATA.tasks&&DATA.tasks.length) || DATA.stages.reduce((n,s)=>n+(s.tasks?.length||0),0);
  const empty=DATA.stages.filter(s=>!s.tasks?.length).length;
  els.loadStatus.textContent=`${msg} · ${count} Aufgaben geladen${empty?` · Hinweis: ${empty} Stufe(n) ohne Aufgaben`:''}`;
  els.start.disabled=false;
}
function initStateStructures(){
  DATA.stages.forEach(s=>{
    state.stats[s.key]=state.stats[s.key]||{attempts:0,correct:0,wrong:0,reviewAttempts:0,reviewCorrect:0,reviewWrong:0,errorTypes:{}};
    state.reviewWeight[s.key]=state.reviewWeight[s.key]||1;
  });
}
function loadLocal(){
  try{const raw=localStorage.getItem(progressKey()); if(!raw)return; const p=JSON.parse(raw);
    Object.assign(state, {stageIndex:p.stageIndex||0,newCorrect:p.newCorrect||0,attempts:p.attempts||0,correct:p.correct||0,effectiveLevel:p.effectiveLevel||state.effectiveLevel,errorLog:p.errorLog||[],badges:p.badges||{},lastResults:p.lastResults||[] });
    if(p.stats) state.stats=p.stats; if(p.reviewWeight) state.reviewWeight=p.reviewWeight; initStateStructures();
  }catch(e){console.warn(e)}
}
function saveLocal(){
  const p={stageIndex:state.stageIndex,newCorrect:state.newCorrect,attempts:state.attempts,correct:state.correct,effectiveLevel:state.effectiveLevel,stats:state.stats,reviewWeight:state.reviewWeight,errorLog:state.errorLog.slice(-80),badges:state.badges,lastResults:state.lastResults.slice(-20)};
  localStorage.setItem(progressKey(), JSON.stringify(p));
}

function autoAdjustLevel(){
  if(state.selectedLevel!=='auto'){state.effectiveLevel=state.selectedLevel;return;}
  const recent=state.lastResults.slice(-12); if(recent.length<8){state.effectiveLevel='A';return;}
  const rate=recent.filter(Boolean).length/recent.length;
  if(rate>=.86 && state.attempts>18) state.effectiveLevel='C';
  else if(rate>=.76) state.effectiveLevel='B';
  else state.effectiveLevel='A';
}
function availableTasks(stageKey){
  autoAdjustLevel();
  const s=DATA.stages.find(x=>x.key===stageKey); if(!s)return[];
  const max=rank(state.effectiveLevel);
  let tasks=(s.tasks||[]).filter(t=>rank(t.difficulty||t.level||t.niveau||'A')<=max);
  if(!tasks.length) tasks=s.tasks||[];
  return tasks.filter(Boolean);
}
function chooseTask(){
  state.selected=null; state.answered=false;
  let candidates=[];
  if(state.stageIndex<DATA.stages.length && availableTasks(stage().key).length)candidates.push({key:stage().key,mode:'new',weight:7});
  for(let i=0;i<state.stageIndex;i++){
    const key=DATA.stages[i].key;
    if(availableTasks(key).length)candidates.push({key,mode:'review',weight:state.reviewWeight[key]||1});
  }
  if(!candidates.length){
    els.prompt.textContent='Keine passende Aufgabe gefunden';
    els.typeBadge.textContent='Datenproblem';
    els.ruleInline.classList.remove('open');
    els.work.innerHTML='<div class="sentence">Die JSON wurde geladen, aber für die aktuelle Stufe wurden keine Aufgaben gefunden.<br><small>Prüfe, ob Aufgaben entweder in <code>stages[].tasks</code> stehen oder oben als <code>tasks</code> mit passendem <code>stage</code>-Schlüssel angegeben sind.</small></div>';
    els.feedback.textContent='Bitte JSON-Struktur prüfen.';
    els.feedback.className='feedback bad';
    return;
  }
  let chosen=null;
  if(state.stageIndex>0 && state.newSinceReview>=REVIEW_AFTER) chosen=candidates.filter(c=>c.mode==='review').sort((a,b)=>b.weight-a.weight)[0];
  if(!chosen){let sum=candidates.reduce((a,b)=>a+b.weight,0), r=Math.random()*sum; for(const c of candidates){r-=c.weight;if(r<=0){chosen=c;break}}}
  const tasks=availableTasks(chosen.key); const base=rand(tasks);
  if(!base){ console.error('[Aufgaben] Leere Aufgabenliste für', chosen); return; }
  const t={...base,stage:base.stage||chosen.key,mode:chosen.mode,type:base.type||'choice'};
  state.current=t; renderTask();
  track(`task|stage=${t.stage}|type=${t.type}|mode=${t.mode}|level=${state.effectiveLevel}`, {event:'task',stage:t.stage,type:t.type,level:state.effectiveLevel,progress:progressPercent(),attempts:state.attempts});
}
function taskKindName(t){return {choice:'Auswahl',choice_reason:'Begründung',gap:'Lückentext',mark:'Fehler finden',sort:'Sortieren',text:'Freitext',free_text:'Freitext'}[t.type]||t.type}
function renderTask(){
  const t=state.current;
  els.prompt.textContent=t.prompt||'Aufgabe'; els.typeBadge.textContent=label(t.stage)+' · '+taskKindName(t);
  els.ruleInline.innerHTML=currentRule()+(t.hint?'<br><b>Hinweis:</b> '+esc(t.hint):'');
  els.ruleInline.classList.toggle('open', state.effectiveLevel==='A');
  els.ruleToggle.textContent=els.ruleInline.classList.contains('open')?'Regel ausblenden':'Regel anzeigen';
  els.feedback.textContent=''; els.feedback.className='feedback'; els.check.classList.remove('show'); els.next.classList.remove('show');
  els.work.innerHTML='';
  if(t.type==='choice'||t.type==='choice_reason') renderChoice(t);
  else if(t.type==='gap') renderGap(t);
  else if(t.type==='mark') renderMark(t);
  else if(t.type==='sort') renderSort(t);
  else if(t.type==='text'||t.type==='free_text') renderText(t);
  renderJourney(); updateMenu();
}
function showCheck(){let show=false; const t=state.current; if(!t)return; if(['choice','choice_reason','gap','mark'].includes(t.type)) show=state.selected!==null&&state.selected!==undefined; if(t.type==='sort') show=t.items.every((_,i)=>state.selected?.placements?.[i]); if(t.type==='text'||t.type==='free_text') show=(document.getElementById('textAnswer')?.value||'').trim().length>1; els.check.classList.toggle('show',show)}
function renderChoice(t){els.work.innerHTML=`<div><div class="sentence">${esc(t.sentence||'Wähle die richtige Antwort.')}</div><div class="options">${t.options.map(o=>`<button class="option" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`; els.work.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(state.answered)return; state.selected=b.dataset.v; els.work.querySelectorAll('.option').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); showCheck();})}
function renderGap(t){const sent=esc(t.sentence||'___').replace('___','<span class="blank" id="blank">___</span>'); els.work.innerHTML=`<div><div class="sentence">${sent}</div><div class="options">${t.options.map(o=>`<button class="option" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`; els.work.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(state.answered)return; state.selected=b.dataset.v; document.getElementById('blank').textContent=b.dataset.v; els.work.querySelectorAll('.option').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); showCheck();})}
function renderMark(t){els.work.innerHTML=`<div><div class="sentence">Klicke im Satz:</div><div class="word-row">${t.words.map((w,i)=>`<button class="word-btn" data-i="${i}">${esc(w)}</button>`).join('')}</div></div>`; els.work.querySelectorAll('.word-btn').forEach(b=>b.onclick=()=>{if(state.answered)return; state.selected=Number(b.dataset.i); els.work.querySelectorAll('.word-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); showCheck();})}
function renderSort(t){state.selected={active:null,placements:{}}; els.work.innerHTML=`<div><div class="word-row">${t.items.map((it,i)=>`<span class="chip" data-i="${i}">${esc(it.text)}</span>`).join('')}</div><div class="sort-area">${t.groups.map(g=>`<div class="box" data-g="${esc(g)}"><h3>${esc(g)}</h3></div>`).join('')}</div></div>`; els.work.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(state.answered)return; state.selected.active=Number(c.dataset.i); els.work.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected')); c.classList.add('selected');}); els.work.querySelectorAll('.box').forEach(box=>box.onclick=()=>{if(state.answered||state.selected.active===null)return; const i=state.selected.active; const chip=els.work.querySelector(`.chip[data-i="${i}"]`); box.appendChild(chip); chip.classList.remove('selected'); chip.classList.add('placed'); state.selected.placements[i]=box.dataset.g; state.selected.active=null; showCheck();})}
function renderText(t){els.work.innerHTML=`<div class="text-answer"><label><b>Deine Antwort:</b><textarea id="textAnswer" placeholder="Schreibe hier deine Antwort ..."></textarea></label>${t.sampleAnswer?`<div class="sample"><b>Beispiel möglich:</b> ${esc(t.sampleAnswer)}</div>`:''}</div>`; document.getElementById('textAnswer').addEventListener('input',showCheck)}

function evaluateText(t,val){
  const n=norm(val); if((t.accepted||[]).some(a=>norm(a)===n)) return true;
  if(t.stage==='grossschreibung') return /^[A-ZÄÖÜ][a-zäöüß]+$/.test(val.trim());
  if(t.stage==='doppelkonsonant') return /([b-df-hj-np-tv-z])\1/i.test(val);
  if(t.stage==='s_laute') return /ß/.test(val);
  if(t.stage==='dehnung') return /(ie|[aeiouäöü]h|ee|aa|oo)/i.test(val);
  if(t.stage==='wortbausteine') return /fahr/i.test(val);
  if(t.stage==='komma') return /,/.test(val) && /(weil|dass|wenn|obwohl|nachdem|bevor)/i.test(val);
  return false;
}
function checkAnswer(){
  if(!state.current||state.answered)return; const t=state.current; let ok=false, given='';
  if(t.type==='choice'||t.type==='choice_reason'||t.type==='gap'){given=state.selected; ok=norm(given)===norm(t.correct);}
  if(t.type==='mark'){given=String(state.selected); ok=Number(state.selected)===Number(t.errorIndex);}
  if(t.type==='sort'){ok=t.items.every((it,i)=>state.selected.placements[i]===it.group); given=JSON.stringify(state.selected.placements);}
  if(t.type==='text'){given=document.getElementById('textAnswer').value.trim(); ok=evaluateText(t,given);}
  state.answered=true; state.attempts++; state.lastResults.push(ok); state.lastResults=state.lastResults.slice(-20);
  const st=state.stats[t.stage]; st.attempts++; if(ok){state.correct++; st.correct++;} else {st.wrong++; const err=errorType(t); st.errorTypes[err]=(st.errorTypes[err]||0)+1; state.errorLog.push({time:new Date().toLocaleString('de-DE'),stage:t.stage,type:t.type,error:err,prompt:t.prompt,given,correct:t.correct||t.correction||'siehe Aufgabe'});}
  markSolution(ok);
  if(t.mode==='new') handleNew(ok); else handleReview(t.stage,ok);
  els.check.classList.remove('show'); els.next.classList.add('show'); saveLocal(); renderJourney(); updateMenu();
  track(`result|stage=${t.stage}|type=${t.type}|mode=${t.mode}|level=${state.effectiveLevel}|ok=${ok?1:0}`, {event:'result',stage:t.stage,type:t.type,level:state.effectiveLevel,ok,progress:progressPercent(),attempts:state.attempts,error:ok?'':errorType(t)});
}
function errorType(t){return {choice:'Auswahlfehler',choice_reason:'Begründung unsicher',gap:'Lücke falsch',mark:'Fehlerstelle unsicher',sort:'Sortierung unsicher',text:'Freitext/Anwendung unsicher'}[t.type]||'Fehler'}
function markSolution(ok){
  const t=state.current;
  if(t.type==='choice'||t.type==='choice_reason'||t.type==='gap') els.work.querySelectorAll('.option').forEach(b=>{if(norm(b.dataset.v)===norm(t.correct))b.classList.add('correct'); else if(b.classList.contains('selected'))b.classList.add('wrong')});
  if(t.type==='mark') els.work.querySelectorAll('.word-btn').forEach(b=>{const i=Number(b.dataset.i); if(i===Number(t.errorIndex))b.classList.add('correct'); else if(b.classList.contains('selected'))b.classList.add('wrong')});
  if(t.type==='sort') els.work.querySelectorAll('.chip').forEach(c=>{const i=Number(c.dataset.i); c.classList.add(state.selected.placements[i]===t.items[i].group?'correct':'wrong')});
}
function handleNew(ok){
  if(ok){state.newCorrect++; state.newSinceReview++; els.feedback.className='feedback ok'; els.feedback.textContent='Richtig. Deine aktuelle Strategie wird sicherer.'; if(state.newCorrect>=REQUIRED_NEW_CORRECT)unlockStage();}
  else{els.feedback.className='feedback bad'; els.feedback.textContent='Noch nicht sicher. Schau dir den Regelhinweis an und versuche die nächste Aufgabe.';}
}
function handleReview(k,ok){
  state.stats[k].reviewAttempts++;
  if(ok){state.stats[k].reviewCorrect++; state.reviewWeight[k]=Math.max(MIN_REVIEW_WEIGHT,(state.reviewWeight[k]||1)*.72); els.feedback.className='feedback ok'; els.feedback.textContent='Wiederholung richtig. Diese Strategie wird etwas seltener wiederholt.';}
  else{state.stats[k].reviewWrong++; state.reviewWeight[k]=Math.min(MAX_REVIEW_WEIGHT,(state.reviewWeight[k]||1)+1.35); els.feedback.className='feedback bad'; els.feedback.textContent='Wiederholung unsicher. Diese Strategie wird nun häufiger wiederholt.';}
  state.newSinceReview=0;
}
function unlockStage(){
  const old=stage(); state.badges[old.key]=true; const summary=stageSummary(old.key); state.stageIndex++; state.newCorrect=0; state.newSinceReview=0;
  if(state.stageIndex>=DATA.stages.length){els.feedback.className='feedback ok'; els.feedback.innerHTML='Alle Etappen geschafft. Sehr gut! '+summary; track('complete|rechtschreibung',{event:'complete',progress:100});}
  else{els.feedback.className='feedback ok'; els.feedback.innerHTML=`${old.label} geschafft! Neues Lernziel: ${stage().label}. `+summary; track(`unlock|stage=${old.key}|next=${stage().key}`,{event:'unlock',stage:old.key,progress:progressPercent()});}
}
function stageSummary(k){const st=state.stats[k]; const entries=Object.entries(st.errorTypes||{}).sort((a,b)=>b[1]-a[1]); if(!entries.length)return '<br><span>Fehlerkartei: In dieser Etappe keine häufigen Fehler.</span>'; return '<br><span>Fehlerkartei: Das solltest du noch üben: '+entries.map(e=>e[0]+' ('+e[1]+'×)').join(', ')+'</span>'}

function checkpointPercent(i){return 12+i*(80/Math.max(1,DATA.stages.length-1))}
function progressPercent(){if(!DATA)return 0; return Math.round(((state.stageIndex + Math.min(1,state.newCorrect/REQUIRED_NEW_CORRECT))/DATA.stages.length)*100)}
function currentPositionPercent(){if(state.stageIndex>=DATA.stages.length)return 94; const start=state.stageIndex===0?7:checkpointPercent(state.stageIndex-1); const end=checkpointPercent(state.stageIndex); return start+(end-start)*Math.min(1,state.newCorrect/REQUIRED_NEW_CORRECT)}
function renderJourney(){
  if(!DATA)return; els.milestones.innerHTML=''; DATA.stages.forEach((s,i)=>{const m=document.createElement('div'); m.className='milestone '+(i<state.stageIndex?'done':i===state.stageIndex?'current':''); m.style.left=checkpointPercent(i)+'%'; m.innerHTML='<span class="dot"></span>'+esc(s.label); els.milestones.appendChild(m);});
  const pos=currentPositionPercent(); els.stick.style.left=pos+'%'; els.trackFill.style.width=Math.max(0,pos-7)+'%';
  els.smallProgress.textContent=`${state.effectiveLevel} · ${progressPercent()} %`;
}
function successRate(c,a){return a?Math.round(c/a*100)+' %':'0 %'}
function updateMenu(){updateProgressPanel();updateErrorsPanel();updateHelpPanel();updateBadgesPanel()}
function updateProgressPanel(){
  if(!DATA)return; const rows=DATA.stages.map((s,i)=>{const st=state.stats[s.key]||{}; const status=i<state.stageIndex?'gelernt':i===state.stageIndex?'aktuell':'gesperrt'; return `<tr><td>${esc(s.label)}<br><small>${status}</small></td><td>${st.attempts||0}</td><td>${st.correct||0}</td><td>${st.wrong||0}</td><td>${successRate(st.correct||0,st.attempts||0)}</td><td>${Number(state.reviewWeight[s.key]||1).toFixed(1)}</td></tr>`}).join('');
  els.progressPanel.innerHTML=`<h3>Lernstand</h3><div class="stat-grid"><div class="stat"><b>${state.attempts}</b><span>Aufgaben</span></div><div class="stat"><b>${successRate(state.correct,state.attempts)}</b><span>Trefferquote</span></div><div class="stat"><b>${state.effectiveLevel}</b><span>aktive Schwierigkeit</span></div><div class="stat"><b>${state.newCorrect}/${REQUIRED_NEW_CORRECT}</b><span>Etappenfortschritt</span></div></div><p>Auswahl: <b>${state.selectedLevel==='auto'?'automatisch':state.selectedLevel}</b></p><table><thead><tr><th>Strategie</th><th>Ges.</th><th>richtig</th><th>falsch</th><th>Quote</th><th>Wdh.</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function updateErrorsPanel(){
  const logs=state.errorLog.slice(-12).reverse(); els.errorsPanel.innerHTML=`<h3>Deine Fehlerkartei</h3><p>Hier siehst du, welche Bereiche du noch üben solltest.</p>${logs.length?logs.map(e=>`<div class="error-card"><b>${esc(label(e.stage))} · ${esc(e.error)}</b><br><small>${esc(e.time)}</small><p>${esc(e.prompt||'')}</p><p><b>Deine Antwort:</b> ${esc(e.given)}<br><b>Richtig wäre:</b> ${esc(e.correct)}</p></div>`).join(''):'<p>Noch keine Fehler gespeichert.</p>'}`;
}
function updateHelpPanel(){if(!DATA)return; els.helpPanel.innerHTML='<h3>Regelkarten</h3>'+DATA.stages.map((s,i)=>`<div class="help-card"><h4>${esc(s.label)} ${i<=state.stageIndex?'<span class="badge">freigeschaltet</span>':''}</h4><p>${esc(s.rule)}</p><p><b>Beispiele:</b> ${esc((s.examples||[]).join(', '))}</p></div>`).join('')}
function updateBadgesPanel(){if(!DATA)return; els.badgesPanel.innerHTML='<h3>Lernziel-Abzeichen</h3>'+DATA.stages.map(s=>`<div class="help-card"><h4>${state.badges[s.key]?'🏅':'🔒'} ${esc(s.badge||s.label)}</h4><p>${state.badges[s.key]?'erreicht':'noch nicht erreicht'}</p></div>`).join('')}

function startApp(){
  if(!DATA){els.loadStatus.textContent='Aufgaben sind noch nicht geladen.';return}
  const name=els.name.value.trim(); if(name.length<2){els.name.focus();return}
  state.studentName=name; state.selectedLevel=els.level.value; state.effectiveLevel=state.selectedLevel==='auto'?'A':state.selectedLevel;
  localStorage.setItem('km_student_name',name); if(window.KM_SET_STUDENT) window.KM_SET_STUDENT(name); if(window.KM_SET_CONTEXT) window.KM_SET_CONTEXT({level:state.selectedLevel,app:'rechtschreibung'});
  loadLocal(); document.body.classList.remove('login-mode'); document.body.classList.add('running'); els.login.style.display='none'; chooseTask();
}
els.start.onclick=startApp; els.name.onkeydown=e=>{if(e.key==='Enter')startApp()}; els.check.onclick=checkAnswer; els.next.onclick=chooseTask;
els.ruleToggle.onclick=()=>{els.ruleInline.classList.toggle('open'); els.ruleToggle.textContent=els.ruleInline.classList.contains('open')?'Regel ausblenden':'Regel anzeigen'; track('rule|toggle',{event:'rule',stage:state.current?.stage||''})};
els.menuBtn.onclick=()=>{els.drawer.classList.add('open');els.drawerBackdrop.classList.add('open');updateMenu();track('menu|open',{event:'menu'})}; els.drawerClose.onclick=els.drawerBackdrop.onclick=()=>{els.drawer.classList.remove('open');els.drawerBackdrop.classList.remove('open')};
document.querySelectorAll('.drawer-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.drawer-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.panel).classList.add('active');updateMenu();});
els.jsonBtn.onclick=()=>els.jsonFile.click(); els.jsonFile.onchange=async()=>{const f=els.jsonFile.files[0]; if(!f)return; try{const j=JSON.parse(await f.text()); setData(j,'Eigene JSON geladen: '+f.name)}catch(e){els.loadStatus.textContent='JSON konnte nicht gelesen werden: '+e.message}};
const known=localStorage.getItem('km_student_name')||''; if(known)els.name.value=known; els.start.disabled=true; loadData();
</script>
