<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rechtschreibtrainer · Campus Hannah Höch</title>
<style>
:root{--text:#102033;--muted:#64748b;--accent:#2563eb;--ok:#15803d;--bad:#b91c1c;--border:#cbd5e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;width:100%;height:100%;font-family:'Segoe UI',Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#dbeafe,#fff);overflow:hidden} body.login-mode{display:flex;align-items:center;justify-content:center;padding:22px} button{border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:17px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.20)} button:disabled{opacity:.45;cursor:not-allowed} input{font-size:20px;padding:14px 16px;border:2px solid var(--border);border-radius:16px;outline:none;background:#f8fafc;min-width:0} input:focus{border-color:var(--accent);background:#fff}
.login{width:min(620px,94vw);background:#fff;border:1px solid #dbe3ef;border-radius:28px;padding:26px;box-shadow:0 18px 55px rgba(15,23,42,.14);text-align:center}.login img{width:120px;border-radius:18px;margin-bottom:12px}.login h1{margin:0;font-size:clamp(26px,5vw,40px)}.login p{color:var(--muted);line-height:1.45}.login-row{display:flex;gap:10px}.load-status{font-size:13px;color:var(--muted);margin-top:12px}
.app{display:none;width:100vw;height:100dvh;overflow:hidden;background:rgba(255,255,255,.92)}body.running .app{display:flex}.stage{width:100%;height:100%;display:grid;grid-template-rows:auto 96px auto 1fr auto;background:#fff;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid #e2e8f0;background:#fff}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:50px;height:50px;object-fit:contain;border-radius:12px}.title{font-weight:950;font-size:clamp(17px,3vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.top-right{display:flex;align-items:center;gap:8px}.pill{font-size:13px;color:#334155;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:7px 10px;white-space:nowrap}.menu-btn{width:46px;height:42px;padding:0;border-radius:14px;background:#111827;font-size:24px;display:flex;align-items:center;justify-content:center}
.journey{position:relative;background:#f8fafc;border-bottom:1px solid #e2e8f0;overflow:hidden}.track-line{position:absolute;left:7%;right:5%;top:46px;height:8px;border-radius:99px;background:#cbd5e1}.track-fill{position:absolute;left:7%;top:46px;height:8px;border-radius:99px;background:linear-gradient(90deg,#22c55e,#2563eb);width:0;transition:.35s}.milestone{position:absolute;top:26px;transform:translateX(-50%);width:110px;text-align:center;font-size:10px;font-weight:900;color:#334155}.milestone .dot{display:block;width:20px;height:20px;border:4px solid #94a3b8;border-radius:50%;background:#fff;margin:5px auto 2px}.milestone.done .dot{border-color:#16a34a;background:#dcfce7}.milestone.current .dot{border-color:#2563eb;background:#dbeafe}.stick{position:absolute;top:12px;left:7%;width:34px;height:54px;transform:translateX(-50%);transition:.35s;filter:drop-shadow(0 4px 5px rgba(15,23,42,.18))}.stick svg{width:100%;height:100%}.stick line,.stick circle{stroke:#111827;stroke-width:4;stroke-linecap:round;fill:#fff}.stick .head{fill:#fef3c7}
.taskline{padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}.prompt{font-size:clamp(20px,4vw,38px);font-weight:950;line-height:1.12}.type-badge{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:999px;padding:7px 11px;font-weight:900;white-space:nowrap}
.work{margin:0 14px 8px;border:2px dashed #dbeafe;background:#f8fafc;border-radius:24px;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}.inner{width:min(980px,100%);text-align:center}.sentence{font-size:clamp(24px,4vw,46px);font-weight:800;line-height:1.35}.options{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}.option{background:#fff;color:#0f172a;border:2px solid #cbd5e1;box-shadow:none;min-width:120px}.option.selected{background:#dbeafe;border-color:#2563eb}.option.correct{background:#dcfce7;border-color:#16a34a;color:#14532d}.option.wrong{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}.blank{display:inline-flex;min-width:120px;border-bottom:5px solid #2563eb;justify-content:center;color:#2563eb}
.word-btn{background:#fff;color:#0f172a;border:2px solid #cbd5e1;box-shadow:none;margin:5px}.word-btn.selected{background:#fee2e2;border-color:#ef4444}.word-btn.correct{background:#dcfce7;border-color:#16a34a}.sort-area{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.box{min-height:120px;background:#fff;border:2px solid #cbd5e1;border-radius:18px;padding:10px}.box h3{margin:0 0 8px;font-size:16px;color:#334155}.chip{display:inline-flex;margin:5px;padding:9px 12px;border-radius:999px;background:#e2e8f0;color:#0f172a;font-weight:800;cursor:pointer}.chip.selected{background:#dbeafe;outline:3px solid #2563eb}.chip.placed{background:#e0f2fe}.chip.correct{background:#dcfce7}.chip.wrong{background:#fee2e2}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid #e2e8f0;background:#fff}.feedback{font-weight:800;color:var(--muted);line-height:1.25}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.check{display:none;background:#0f766e}.check.show,.next.show{display:inline-flex}.next{display:none;background:#111827}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50}.drawer-backdrop.open{display:block}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(460px,92vw);background:#fff;z-index:51;transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column;box-shadow:24px 0 60px rgba(15,23,42,.25)}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #e2e8f0;background:#f8fafc}.drawer-head img{width:42px;border-radius:10px}.drawer-head h2{flex:1;margin:0}.drawer-close{background:#e2e8f0;color:#111827;box-shadow:none;padding:8px 12px}.drawer-tabs{display:flex;gap:6px;padding:10px;background:#f8fafc;border-bottom:1px solid #e2e8f0}.drawer-tab{flex:1;font-size:14px;background:#e2e8f0;color:#111827;box-shadow:none;padding:9px}.drawer-tab.active{background:#2563eb;color:#fff}.panel{display:none;overflow:auto;padding:14px;flex:1}.panel.active{display:block}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:10px}.stat b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e2e8f0;padding:7px;text-align:center}th{background:#eff6ff}td:first-child,th:first-child{text-align:left;font-weight:800}.help-card{border:1px solid #e2e8f0;background:#f8fafc;border-radius:16px;padding:12px;margin:10px 0}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900}
@media(max-height:620px){.stage{grid-template-rows:auto 78px auto 1fr auto}.brand img{width:38px;height:38px}.track-line,.track-fill{top:36px}.milestone{top:17px;font-size:9px}.stick{top:8px;width:28px;height:45px}.prompt{font-size:clamp(18px,3vw,30px)}.sentence{font-size:clamp(20px,3vw,34px)}button{font-size:15px;padding:10px 13px}}@media(max-width:520px){.login-row{flex-direction:column}.title{font-size:16px}.sub{display:none}.pill{display:none}.bottom{flex-wrap:wrap}.taskline{align-items:flex-start;flex-direction:column}}
</style>

<script>
const els={login:document.getElementById('login'),app:document.getElementById('app'),name:document.getElementById('nameInput'),start:document.getElementById('startBtn'),loadStatus:document.getElementById('loadStatus'),fileBtn:document.getElementById('fileBtn'),jsonFile:document.getElementById('jsonFile'),prompt:document.getElementById('prompt'),work:document.getElementById('work'),check:document.getElementById('checkBtn'),next:document.getElementById('nextBtn'),feedback:document.getElementById('feedback'),typeBadge:document.getElementById('typeBadge'),smallProgress:document.getElementById('smallProgress'),milestones:document.getElementById('milestones'),trackFill:document.getElementById('trackFill'),stick:document.getElementById('stick'),menuBtn:document.getElementById('menuBtn'),drawer:document.getElementById('drawer'),drawerBackdrop:document.getElementById('drawerBackdrop'),drawerClose:document.getElementById('drawerClose'),progressPanel:document.getElementById('progressPanel'),helpPanel:document.getElementById('helpPanel'),badgePanel:document.getElementById('badgePanel')};
let DATA=null; const REQUIRED=6, MINW=.55, MAXW=7, REVIEW_AFTER=2;
const state={name:'',stageIndex:0,stageCorrect:0,attempts:0,correct:0,current:null,selected:null,answered:false,stats:{},reviewWeight:{},newSinceReview:0,badges:[]};
function slug(s){return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function pkey(){return 'rechtschreibtrainer_v1_'+slug(state.name||'gast')}
function track(a){if(typeof window.KM_TRACK_EVENT==='function') window.KM_TRACK_EVENT(a); console.log('[RS]',a)}
function label(k){return DATA.stages.find(s=>s.key===k)?.label||k}
function stage(){return DATA.stages[Math.min(state.stageIndex,DATA.stages.length-1)]}
function tasksFor(k){return DATA.tasks.filter(t=>t.stage===k)}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function loadData(){const names=['rechtschreibung_aufgaben_v1.json','./rechtschreibung_aufgaben_v1.json','rechtschreibung_aufgaben.json']; for(const n of names){try{const r=await fetch(n+'?v='+Date.now(),{cache:'no-store'}); if(r.ok){const j=await r.json(); return setData(j,'externe JSON geladen');}}catch(e){}} setData(window.RECHTSCHREIB_FALLBACK_DATA,'interne Aufgaben aktiv: externe JSON konnte nicht geladen werden');}
function setData(j,msg){if(!j||!Array.isArray(j.stages)||!Array.isArray(j.tasks)) throw new Error('Ungültige JSON-Struktur'); DATA=j; DATA.stages.forEach(s=>{if(!state.stats[s.key]) state.stats[s.key]={attempts:0,correct:0,wrong:0,reviewAttempts:0,reviewCorrect:0,reviewWrong:0}; if(!state.reviewWeight[s.key]) state.reviewWeight[s.key]=1;}); els.start.disabled=false; els.loadStatus.textContent=msg;}
els.fileBtn.onclick=()=>els.jsonFile.click(); els.jsonFile.onchange=e=>{const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{try{setData(JSON.parse(rd.result),'manuell gewählte JSON geladen');}catch(err){els.loadStatus.textContent='JSON fehlerhaft: '+err.message;}}; rd.readAsText(f,'utf-8');};
function save(){localStorage.setItem(pkey(),JSON.stringify({stageIndex:state.stageIndex,stageCorrect:state.stageCorrect,attempts:state.attempts,correct:state.correct,stats:state.stats,reviewWeight:state.reviewWeight,badges:state.badges,newSinceReview:state.newSinceReview}));}
function load(){try{const raw=localStorage.getItem(pkey()); if(!raw)return; const s=JSON.parse(raw); Object.assign(state,{stageIndex:s.stageIndex||0,stageCorrect:s.stageCorrect||0,attempts:s.attempts||0,correct:s.correct||0,badges:s.badges||[],newSinceReview:s.newSinceReview||0}); if(s.stats) DATA.stages.forEach(x=>state.stats[x.key]={...state.stats[x.key],...(s.stats[x.key]||{})}); if(s.reviewWeight) DATA.stages.forEach(x=>state.reviewWeight[x.key]=Math.max(MINW,Math.min(MAXW,Number(s.reviewWeight[x.key])||1)));}catch(e){console.warn(e)}}
function posPercent(){if(state.stageIndex>=DATA.stages.length)return 94; const checkpoint=i=>20+i*(74/(DATA.stages.length-1)); const start=state.stageIndex===0?7:checkpoint(state.stageIndex-1); const end=checkpoint(state.stageIndex); return start+(end-start)*Math.min(1,state.stageCorrect/REQUIRED);}
function renderJourney(){els.milestones.innerHTML=''; const checkpoint=i=>20+i*(74/(DATA.stages.length-1)); DATA.stages.forEach((s,i)=>{const d=document.createElement('div'); d.className='milestone '+(i<state.stageIndex?'done':i===state.stageIndex?'current':''); d.style.left=checkpoint(i)+'%'; d.innerHTML=`<span class="dot"></span>${s.label}`; els.milestones.appendChild(d);}); const p=posPercent(); els.stick.style.left=p+'%'; els.trackFill.style.width=Math.max(0,p-7)+'%'; els.smallProgress.textContent=state.stageIndex>=DATA.stages.length?'Alle Strategien geschafft':`Neu: ${stage().label} ${state.stageCorrect}/${REQUIRED}`; updateMenu();}
function chooseTask(){let candidates=[]; if(state.stageIndex<DATA.stages.length)candidates.push({key:stage().key,mode:'new',weight:7}); for(let i=0;i<state.stageIndex;i++){const k=DATA.stages[i].key; candidates.push({key:k,mode:'review',weight:state.reviewWeight[k]})} let chosen; if(state.stageIndex>0 && state.newSinceReview>=REVIEW_AFTER){chosen=candidates.filter(c=>c.mode==='review').sort((a,b)=>b.weight-a.weight)[0];} if(!chosen){const sum=candidates.reduce((a,b)=>a+b.weight,0); let r=Math.random()*sum; for(const c of candidates){r-=c.weight; if(r<=0){chosen=c;break}}} const pool=tasksFor(chosen.key); state.current={...rand(pool),mode:chosen.mode}; state.selected=null; state.answered=false; renderTask(); track(`task|app=rechtschreibung|mode=${chosen.mode}|strategy=${chosen.key}|type=${state.current.type}|stage=${state.stageIndex+1}|progress=${state.stageCorrect}`);}
function renderTask(){const t=state.current; els.prompt.textContent=t.prompt||'Aufgabe'; els.typeBadge.textContent=label(t.stage); els.feedback.textContent=''; els.feedback.className='feedback'; els.check.classList.remove('show'); els.next.classList.remove('show'); els.work.innerHTML=''; if(t.type==='choice') renderChoice(t); if(t.type==='gap') renderGap(t); if(t.type==='mark') renderMark(t); if(t.type==='sort') renderSort(t); renderJourney();}
function showCheck(){let show=false; if(state.current?.type==='sort') show=state.selected && Object.keys(state.selected.placements||{}).length>0; else show=state.selected!==null && state.selected!==undefined && state.selected!==''; els.check.classList.toggle('show',show);}
function renderChoice(t){els.work.innerHTML=`<div class="sentence">${t.sentence}</div><div class="options"></div>`; const box=els.work.querySelector('.options'); shuffle(t.options).forEach(o=>{const b=document.createElement('button'); b.className='option'; b.textContent=o; b.onclick=()=>{if(state.answered)return; state.selected=o; box.querySelectorAll('.option').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); showCheck();}; box.appendChild(b);})}
function renderGap(t){els.work.innerHTML=`<div class="sentence">${t.before}<span class="blank">${state.selected||'____'}</span>${t.after}</div><div class="options"></div>`; const box=els.work.querySelector('.options'); shuffle(t.options).forEach(o=>{const b=document.createElement('button'); b.className='option'; b.textContent=o; b.onclick=()=>{if(state.answered)return; state.selected=o; els.work.querySelector('.blank').textContent=o; box.querySelectorAll('.option').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); showCheck();}; box.appendChild(b);})}
function renderMark(t){els.work.innerHTML='<div class="sentence"></div>'; const s=els.work.querySelector('.sentence'); t.tokens.forEach((tok,i)=>{if(tok==='.'){s.append(document.createTextNode('. '));return} const b=document.createElement('button'); b.className='word-btn'; b.textContent=tok; b.onclick=()=>{if(state.answered)return; state.selected=i; s.querySelectorAll('button').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); showCheck();}; s.appendChild(b); s.append(' ');})}
function renderSort(t){state.selected={placements:{},active:null}; els.work.innerHTML='<div class="sentence">Tippe ein Wort und danach die passende Box an.</div><div class="options"></div><div class="sort-area"></div>'; const opts=els.work.querySelector('.options'), area=els.work.querySelector('.sort-area'); t.items.forEach((it,i)=>{const c=document.createElement('span'); c.className='chip'; c.textContent=it.text; c.dataset.index=i; c.onclick=()=>{if(state.answered)return; state.selected.active=i; opts.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected')); c.classList.add('selected');}; opts.appendChild(c);}); t.groups.forEach(g=>{const b=document.createElement('div'); b.className='box'; b.dataset.group=g; b.innerHTML=`<h3>${g}</h3>`; b.onclick=()=>{if(state.answered||state.selected.active==null)return; state.selected.placements[state.selected.active]=g; const chip=opts.querySelector(`[data-index="${state.selected.active}"]`); chip.classList.remove('selected'); chip.classList.add('placed'); b.appendChild(chip); state.selected.active=null; showCheck();}; area.appendChild(b);});}
function checkAnswer(){if(!state.current||state.answered)return; const t=state.current; let ok=false; if(t.type==='choice'||t.type==='gap') ok=state.selected===t.correct; if(t.type==='mark') ok=Number(state.selected)===Number(t.errorIndex); if(t.type==='sort') ok=t.items.every((it,i)=>state.selected.placements[i]===it.group); state.answered=true; state.attempts++; const st=state.stats[t.stage]; st.attempts++; if(ok){state.correct++; st.correct++;} else st.wrong++; if(t.type==='choice'||t.type==='gap') els.work.querySelectorAll('.option').forEach(b=>{if(b.textContent===t.correct)b.classList.add('correct'); else if(b.classList.contains('selected')) b.classList.add('wrong');}); if(t.type==='mark') els.work.querySelectorAll('.word-btn').forEach((b,i)=>{if(i===t.errorIndex)b.classList.add('correct'); else if(i===state.selected)b.classList.add('wrong');}); if(t.type==='sort') els.work.querySelectorAll('.chip').forEach(ch=>{const i=Number(ch.dataset.index); ch.classList.add(state.selected.placements[i]===t.items[i].group?'correct':'wrong');}); handleResult(ok); els.check.classList.remove('show'); els.next.classList.add('show'); save(); renderJourney(); track(`result|app=rechtschreibung|mode=${t.mode}|strategy=${t.stage}|type=${t.type}|ok=${ok?1:0}|stage=${state.stageIndex+1}|progress=${state.stageCorrect}`);}
function handleResult(ok){const t=state.current; if(t.mode==='new'){state.newSinceReview++; if(ok){state.stageCorrect++; els.feedback.className='feedback ok'; els.feedback.textContent='Richtig! '+(t.explanation||''); if(state.stageCorrect>=REQUIRED){const mastered=t.stage; if(!state.badges.includes(mastered)) state.badges.push(mastered); state.stageIndex++; state.stageCorrect=0; state.newSinceReview=0; if(state.stageIndex<DATA.stages.length){els.feedback.textContent=`${label(mastered)} sicher geschafft. Neue Strategie: ${label(stage().key)}.`; track(`unlock|app=rechtschreibung|mastered=${mastered}|new=${stage().key}`);} else {els.feedback.textContent='Alle Rechtschreibstrategien geschafft. Sehr gut!'; track('complete|app=rechtschreibung');}}} else {els.feedback.className='feedback bad'; els.feedback.textContent='Noch nicht ganz. '+(t.explanation||'Prüfe die Regel noch einmal.');}} else {const st=state.stats[t.stage]; st.reviewAttempts++; state.newSinceReview=0; if(ok){st.reviewCorrect++; state.reviewWeight[t.stage]=Math.max(MINW,state.reviewWeight[t.stage]*.7); els.feedback.className='feedback ok'; els.feedback.textContent='Wiederholung richtig. '+(t.explanation||'');} else {st.reviewWrong++; state.reviewWeight[t.stage]=Math.min(MAXW,state.reviewWeight[t.stage]+1.4); els.feedback.className='feedback bad'; els.feedback.textContent='Diese Strategie wird jetzt häufiger wiederholt. '+(t.explanation||'');}}}
function updateMenu(){if(!DATA)return; const rate=state.attempts?Math.round(state.correct/state.attempts*100)+' %':'0 %'; els.progressPanel.innerHTML=`<h3>Lernstand</h3><div class="stat-grid"><div class="stat"><b>${state.attempts}</b><span>Aufgaben</span></div><div class="stat"><b>${rate}</b><span>Trefferquote</span></div><div class="stat"><b>${state.stageIndex>=DATA.stages.length?'fertig':stage().label}</b><span>aktuelle Strategie</span></div><div class="stat"><b>${state.stageCorrect}/${REQUIRED}</b><span>Etappe</span></div></div><br><table><thead><tr><th>Strategie</th><th>Ges.</th><th>richtig</th><th>falsch</th><th>Wdh.-Faktor</th></tr></thead><tbody>${DATA.stages.map(s=>`<tr><td>${s.label}</td><td>${state.stats[s.key].attempts}</td><td>${state.stats[s.key].correct}</td><td>${state.stats[s.key].wrong}</td><td>${Number(state.reviewWeight[s.key]).toFixed(1)}</td></tr>`).join('')}</tbody></table>`; els.helpPanel.innerHTML='<h3>Strategie-Hilfen</h3>'+DATA.stages.map((s,i)=>`<article class="help-card"><h4>${s.label} ${i<=state.stageIndex?'<span class="badge">frei</span>':'<span class="badge" style="background:#e2e8f0;color:#475569">später</span>'}</h4><p>${s.rule}</p><p><b>Beispiele:</b> ${s.examples.join(', ')}</p></article>`).join(''); els.badgePanel.innerHTML='<h3>Abzeichen</h3>'+DATA.stages.map(s=>`<article class="help-card"><h4>${state.badges.includes(s.key)?s.badge:'🔒 '+s.label}</h4><p>${state.badges.includes(s.key)?'geschafft':'Noch nicht freigeschaltet'}</p></article>`).join('');}
function startApp(){const n=els.name.value.trim(); if(n.length<2){els.name.focus();return} state.name=n; window.KM_STUDENT_NAME=n; localStorage.setItem('km_student_name',n); if(typeof window.KM_SET_STUDENT==='function') window.KM_SET_STUDENT(n); load(); document.body.classList.remove('login-mode'); document.body.classList.add('running'); els.login.style.display='none'; chooseTask(); track('start|app=rechtschreibung|student_login');}
els.start.onclick=startApp; els.name.onkeydown=e=>{if(e.key==='Enter'&&!els.start.disabled)startApp();}; els.check.onclick=checkAnswer; els.next.onclick=chooseTask; els.menuBtn.onclick=()=>{els.drawer.classList.add('open');els.drawerBackdrop.classList.add('open');updateMenu();track('menu|open')}; els.drawerClose.onclick=els.drawerBackdrop.onclick=()=>{els.drawer.classList.remove('open');els.drawerBackdrop.classList.remove('open')}; document.querySelectorAll('.drawer-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.drawer-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.panel).classList.add('active');updateMenu();}); const known=localStorage.getItem('km_student_name')||''; if(known)els.name.value=known; loadData();
</script>
</body>
</html>
